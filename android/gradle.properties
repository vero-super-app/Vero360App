# Gradle heap lowered so Dart (kernel snapshot) has room alongside the Gradle daemon on 16GB PCs.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=false
org.gradle.workers.max=2
# Project lives on D:; Pub cache and the Flutter SDK are on C:.
# Kotlin incremental caches crash across drives ("different roots") and can hang release builds.
kotlin.incremental=false
android.useAndroidX=true
android.enableJetifier=true

# Didit: skip NFC native deps on low-RAM devices (OCR + face still available).
diditSdkAndroidVariant=autodetection
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
