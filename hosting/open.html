<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vero360</title>
  <meta name="description" content="Stay and listings on Vero360." />
  <meta property="og:site_name" content="Vero360" />
  <meta property="og:title" content="Vero360" />
  <meta property="og:description" content="View this stay on Vero360." />
  <meta property="og:type" content="website" />
  <style>
    :root { --orange:#FF8A00; --navy:#16284C; --muted:#5B6475; --line:#E8E4DC; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, Segoe UI, sans-serif;
      background: #FFF8F1;
      color: var(--navy);
    }
    header {
      background: linear-gradient(120deg, #D94F00, var(--orange));
      color: #fff;
      padding: 16px 20px;
      font-weight: 900;
      letter-spacing: -0.3px;
    }
    main { max-width: 560px; margin: 0 auto; padding: 16px; }
    .hero {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      border-radius: 18px;
      background: #F3E6D6;
      display: none;
    }
    .hero.show { display: block; }
    h1 { font-size: 24px; margin: 16px 0 6px; }
    .loc { color: var(--muted); font-weight: 600; margin: 0 0 10px; }
    .price { font-size: 20px; font-weight: 900; color: var(--orange); margin: 0 0 18px; }
    .card {
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 16px;
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border-radius: 14px;
      padding: 14px 16px;
      font-weight: 800;
      margin-top: 10px;
    }
    .primary { background: var(--orange); color: #fff; }
    .ghost { background: #FFF4E5; color: var(--navy); }
    .note { font-size: 13px; color: var(--muted); margin-top: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <header>Vero360</header>
  <main>
    <img id="hero" class="hero" alt="" />
    <h1 id="title">Stay on Vero360</h1>
    <p class="loc" id="loc"></p>
    <p class="price" id="price"></p>
    <div class="card">
      <a class="btn primary" id="openApp" href="#">Open in Vero360 app</a>
      <a class="btn ghost" id="store" href="https://play.google.com/store/apps/details?id=com.vero265.app">Get the app</a>
      <p class="note" id="note">Have Vero360? This stay opens in the app. If you don’t, you can view it here.</p>
    </div>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var segs = location.pathname.replace(/\/+$/, '').split('/').filter(Boolean);
      var kind = (segs[0] || 'accommodation').toLowerCase();
      var id = segs[1] || '';
      var name = params.get('name') || params.get('q') || '';
      var loc = params.get('loc') || '';
      var price = params.get('price') || '';
      var period = params.get('period') || '';
      var img = params.get('img') || '';

      var isStay = kind === 'accommodation' || kind === 'stay' || kind === 'stays';
      var appPath = isStay ? 'accommodation' : (kind === 'marketplace' ? 'marketplace' : kind);
      var custom = 'vero360://' + appPath + (id ? '/' + id : '');

      document.title = name ? (name + ' · Vero360') : 'Vero360';
      if (name) document.getElementById('title').textContent = name;
      else if (!isStay) document.getElementById('title').textContent = 'Vero360 listing';
      if (loc) document.getElementById('loc').textContent = loc;
      if (price) document.getElementById('price').textContent = 'MWK ' + price + (period ? ' ' + period : '');
      if (img && /^https?:/i.test(img)) {
        var hero = document.getElementById('hero');
        hero.src = img;
        hero.classList.add('show');
      }

      document.getElementById('openApp').href = custom;

      var ua = navigator.userAgent || '';
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua);
      var fromApp = /Vero360|Flutter/i.test(ua);
      var alreadyTried = params.get('apptry') === '1';

      // Has the app → open it. No app → stay on this website page (never Play Store).
      if (fromApp || alreadyTried || (!isAndroid && !isIOS)) return;

      if (isAndroid) {
        var fallback = new URL(location.href);
        fallback.searchParams.set('apptry', '1');
        var intent =
          'intent://' + appPath + (id ? '/' + id : '') +
          '#Intent;scheme=vero360;package=com.vero265.app;S.browser_fallback_url=' +
          encodeURIComponent(fallback.toString()) + ';end';
        window.location.replace(intent);
        return;
      }

      // iOS: try the app. Safari stays on this listing if it isn’t installed.
      var start = Date.now();
      var left = false;
      document.addEventListener('visibilitychange', function () {
        if (document.hidden) left = true;
      });
      window.location.href = custom;
      setTimeout(function () {
        if (left || Date.now() - start > 2500) return;
      }, 1500);
    })();
  </script>
</body>
</html>
