name: vero360_app
description: "Vero360 - One App. Everything."
publish_to: 'none'

version: 1.3.5+10032

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter
  cupertino_icons: ^1.0.8
  web_socket_channel: ^3.0.3
  http: ^1.2.2
  dio: ^5.4.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  share_plus: any
  fluttertoast: ^9.0.0
  flutter_secure_storage: ^10.0.0
  local_auth: ^2.3.0
  qr_flutter: ^4.1.0
  saver_gallery: ^4.0.1
  app_links: ^6.0.0
  permission_handler: ^12.0.1
  uuid: ^4.4.0

  # Authentication
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1
  jwt_decoder: ^2.0.1

  # Maps / Location
  google_maps_flutter: ^2.2.8
  google_maps_flutter_android: ^2.18.12
  google_maps_flutter_platform_interface: ^2.14.1
  google_maps_flutter_web: ^0.5.14+3
  flutter_polyline_points: ^3.1.0
  geolocator: ^14.0.2
  location: ^8.0.1
  geocoding: ^4.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # State Management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # File / Path
  path_provider: ^2.1.4
  path: ^1.9.0
  package_info_plus: ^8.3.1

  # Environment
  flutter_dotenv: ^5.1.0

  # Audio
  record: ^6.1.2
  audioplayers: ^6.1.0

  # Notifications
  firebase_messaging: 16.1.1
  flutter_local_notifications: ^17.2.0

  # MIME / HTTP
  mime: ^2.0.0
  http_parser: ^4.0.2

  # UI / UX
  carousel_slider: ^5.0.0
  flutter_screenutil: ^5.9.3
  url_launcher: ^6.3.0
  pdfx: ^2.8.0
  cached_network_image: ^3.4.1
  flutter_slidable: ^3.1.2

  # Media
  # image_picker uses the Android system photo picker.
  # Do not request READ_MEDIA_IMAGES or READ_MEDIA_VIDEO.
  image_picker: ^1.2.2
  video_player: ^2.9.2
  image: ^4.8.0

  # Firebase
  firebase_core: ^4.3.0
  firebase_analytics: ^12.0.0
  firebase_auth: ^6.1.3
  firebase_auth_web: ^6.1.1
  # 6.3.0+ Pipelines fail iOS archive on current Firebase iOS SDK
  # (FLTPipelineParser / FIRCollectionSourceStageBridge). Stay on 6.2.0
  # until FlutterFire 6.5+ is taken as a full Firebase upgrade.
  # Keep platform_interface on 7.1.0 (see dependency_overrides). 7.2.0+
  # inserts Pipeline pigeon types and breaks every Android Firestore get/snapshot.
  cloud_firestore: 6.2.0
  firebase_storage: ^13.0.5
  cloud_functions: ^6.0.5

  # Networking / Realtime
  socket_io_client: ^2.0.2

  # Local Database
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0
  universal_io: ^2.2.2

  # WebView
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.1
  webview_flutter_wkwebview: ^3.17.0
  webview_windows: ^0.4.0
  crypto: ^3.0.7
  flutter_webrtc: ^1.6.2+hotfix.4

  # Native Didit SDK requires Dart >=3.11 (Flutter ~3.44+).
  # This app currently uses Didit's hosted verification URL
  # through WebView instead.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  rename: ^3.0.1
  build_runner: ^2.5.4
  hive_ce_generator: ^1.9.2

dependency_overrides:
  firebase_storage_web: ^3.6.22
  cloud_firestore_platform_interface: 7.1.0
  cloud_firestore_web: 5.2.0

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
    background_color: "#FF8A00"
    theme_color: "#FF8A00"
  image_path: "assets/icons/app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true

flutter:
  # Flutter 3.44 turns on SwiftPM by default. Mixed FlutterFire pins
  # (cloud_firestore 6.2.0 vs firebase_messaging 16.1.1) cannot resolve
  # on SPM, and several plugins still need CocoaPods.
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    # Environment
    - .env.example

    # General assets
    - assets/happy.jpg
    - assets/uber-cabs-1024x576.webp
    - assets/logo_mark.png
    - assets/Queens-Tavern-Steak.jpg
    - assets/veroai.jpg
    - assets/google.png
    - assets/apple.webp

    # Brand assets
    - assets/brands/apple_music.png
    - assets/brands/spotify.jpg
    - assets/brands/netflix.png
    - assets/brands/chatgpt.png
    - assets/brands/claude.png

    # Icons
    - assets/icons/playstore.png
    - assets/playstore.png

    # Courier assets
    - assets/courier/

    # Documents
    - assets/documents/Vero360_Platform_Agreement_Policy.pdf
    - assets/documents/Vero360_Privacy_Policy.pdf
    - assets/documents/Vero360_Merchant_Terms_Conditions.pdf
    - assets/documents/Vero360_Cybersecurity_Fraud_Prevention_Customer_Protection_Policy.pdf
    - assets/documents/Vero360_Refund_Policy.pdf
    - assets/documents/Vero360_Subscription_Payment_Policy_v2.pdf
    - assets/documents/Vero360_Car_Hire_Service_Policy.pdf